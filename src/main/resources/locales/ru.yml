border:
  toggle:
    description: переключает границу вкл/выкл
    border-on: <green>Граница включена.</green>
    border-off: <red>Граница отключена.</red>
  set-type:
    description: меняет тип границы
    changed: <green>Тип границы изменён на <aqua>[type]</aqua>.</green>
    error-unavailable-type: <red>Этот тип недоступен или не существует.</red>
  set-color:
    description: меняет цвет границы
    changed: <green>Цвет границы изменён на <aqua>[color]</aqua>.</green>
    error-invalid-color: '<red>Недопустимый цвет. Допустимые цвета: красный, зеленый,
      синий.</red>'
