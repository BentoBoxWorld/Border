  set-color:
    description: cambia il colore del bordo
    changed: '<green>Il colore del bordo è stato cambiato in <aqua>[color]</aqua>.</green>'
    error-invalid-color: '<red>Colore non valido. Colori validi: red, green, blue.</red>'
